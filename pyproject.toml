[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "supplement_engine"
version = "0.2.0"
description = "Phase 2 deterministic rules engine for the supplement reasoning prototype (SYNTHETIC DATA / RESEARCH PROTOTYPE / NOT MEDICAL ADVICE)."
readme = "PROJECT_BRIEF.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
